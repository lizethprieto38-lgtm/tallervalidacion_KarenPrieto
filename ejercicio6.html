<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cambio de contraseña</title>
</head>
<body>

    <h2>Formulario Cambio de Contraseña</h2>

    <form>

        <label>Contraseña Actual:</label><br>
        <input type="password" id="password" placeholder="Ingresa contraseña actual"><br><br>

        <label>Nueva Contraseña:</label><br>
        <input type="password" id="nuevacontra" placeholder="Ingresa nueva contraseña"><br><br>

        <label>Confirmar Contraseña:</label><br>
        <input type="password" id="confirmarcontra" placeholder="Confirma la contraseña"><br><br>

        <button type="button" id="boton">
            Cambiar contraseña
        </button>

        <h3 id="resultado"></h3>

    </form>

    <script src="Validacion6.js"></script>

</body>
</html>
